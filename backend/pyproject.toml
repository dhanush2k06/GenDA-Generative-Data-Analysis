[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genda"
version = "0.2.0"
description = "GenDA — Generative Data Analyst local Python backend"
authors = [{ name = "GenDA Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "polars>=0.20.0",
    "duckdb>=0.10.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "statsmodels>=0.14.0",
    "plotly>=5.20.0",
    "jinja2>=3.1.0",
    "charset-normalizer>=3.3.0",
    "python-multipart>=0.0.9",
    "pyarrow>=15.0.0",
]

[project.scripts]
genda = "genda.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
